name: Roube um Ovo - SKIP das cutscenes
on:
  push:
    branches: [roube-um-ovo-3d-multiplayer]
    paths:
      - 'radioactive-cutscene.js'
      - 'entrance-cinematic.js'
      - 'server.js'
      - 'index.html'
      - 'tests/skip-cinematics-browser.cjs'
      - '.github/workflows/skip-cutscenes.yml'
  workflow_dispatch:
jobs:
  skip-on-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências do navegador
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Pular cutscene, parar som e iniciar jogo
        run: node tests/skip-cinematics-browser.cjs

name: Build Cloud Futebol APK
on:
  push:
    branches: [cloud-futebol-app]
    paths:
      - 'cloud-futebol/**'
      - '.github/workflows/build-cloud-futebol.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile Android APK
        run: gradle -p cloud-futebol :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CloudFutebol-APK
          path: cloud-futebol/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

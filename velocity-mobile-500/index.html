$('play').onclick=()=>{active=true;$('intro').classList.add('hidden');$('hud').classList.remove('hidden');announce('Bem-vindo! Use AÇÃO perto dos veículos.')};$('swap').onclick=()=>{index=(index+1)%3;sync();announce(charList[index].toUpperCase())};$('view').onclick=()=>{view=(view+1)%3;announce('Câmera '+(view+1))};$('pause').onclick=()=>{paused=true;$('paused').classList.remove('hidden')};$('resume').onclick=()=>{paused=false;$('paused').classList.add('hidden')};$('save').onclick=()=>{localStorage.setItem('gtav_real_save',JSON.stringify(player));announce('Posição salva')};function action(){if(car){player.x=car.x+4;player.z=car.z+4;car=null;sync();announce('Saiu do veículo');return}let best=null,dist=14;for(const c of vehicles){let d=Math.hypot(player.x-c.x,player.z-c.z);if(d<dist){best=c;dist=d}}if(best){car=best;camYaw=best.dir+Math.PI;sync();announce('Entrou: '+best.kind+' • ACELERAR para dirigir')}else announce('Chegue perto de um veículo')}$('action').onclick=action;

let hold=null,stick=$('stick');function joy(e){let r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,len=Math.max(1,Math.hypot(x,y)),m=Math.min(1,49/len);input.x=x*m/49;input.y=y*m/49;$('knob').style.transform='translate('+(input.x*49)+'px,'+(input.y*49)+'px)'}stick.addEventListener('pointerdown',e=>{hold=e.pointerId;stick.setPointerCapture(hold);joy(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===hold)joy(e)});function release(e){if(e.pointerId!==hold)return;hold=null;input.x=input.y=0;$('knob').style.transform='translate(0,0)'}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);

function update(dt){let dx=Math.max(-1,Math.min(1,input.x+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0))),dy=Math.max(-1,Math.min(1,input.y+(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)));if(car){let v=car;v.speed+=( (input.gas||dy<-.2?1:0)-(input.brake||dy>.2?1:0))*22*dt;v.speed*=1-.17*dt;v.speed=Math.max(-8,Math.min(30,v.speed));v.dir-=dx*dt*1.45*(v.speed>=0?1:-1);v.x+=Math.sin(v.dir)*v.speed*dt;v.z+=Math.cos(v.dir)*v.speed*dt;v.obj.position.set(v.x,0,v.z);v.obj.rotation.y=v.dir;player.x=v.x;player.z=v.z}else{let l=Math.hypot(dx,dy);if(l>.12){heading=Math.atan2(-dx,-dy)+camYaw-Math.PI;player.x+=Math.sin(heading)*(input.run?9:5)*dt;player.z+=Math.cos(heading)*(input.run?9:5)*dt}if(chars[charList[index]]){let o=chars[charList[index]];o.position.x=player.x;o.position.z=player.z;o.rotation.y=heading}}let pos=car?car.obj.position:new T.Vector3(player.x,0,player.z),yaw=car?car.dir+Math.PI:camYaw;if(view===2)yaw=camYaw;let distance=view===1?(car?-1.3:2.4):view===2?9:car?8:5.2,height=view===2?5.0:car?2.4:2.25;let dest=new T.Vector3(pos.x+Math.sin(yaw)*distance,height+camPitch*2,pos.z+Math.cos(yaw)*distance);cam.position.lerp(dest,.2);let focus=view===1&&car?new T.Vector3(pos.x-Math.sin(yaw)*20,1.5,pos.z-Math.cos(yaw)*20):new T.Vector3(pos.x,1.55,pos.z);cam.lookAt(focus)}
